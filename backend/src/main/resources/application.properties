spring.application.name=website-management
server.port=${PORT:6900}
# Host header proxy (nginx / vite) se aaye to bhi sahi mile
server.forward-headers-strategy=framework

# ---- Master DB: tenants + super admins ----
spring.datasource.url=${MASTER_DB_URL:jdbc:mysql://localhost:3306/wm_master?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-master.sql

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# ---- Tenant DBs (same MySQL server, alag database per tenant) ----
app.tenant-db.url-template=${TENANT_DB_URL_TEMPLATE:jdbc:mysql://localhost:3306/{db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
app.tenant-db.username=${DB_USERNAME:root}
app.tenant-db.password=${DB_PASSWORD:}
app.tenant-db.db-prefix=wm_t_
app.tenant-db.max-pool-size=5

# ---- Domain: local = localhost (abc.localhost), live = yourdomain.com (abc.yourdomain.com) ----
app.base-domain=${BASE_DOMAIN:localhost}
app.reserved-subdomains=www,admin,api,app,mail

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:change-me-local-dev-secret-key-min-32-bytes-long!!}
app.jwt.access-minutes=${JWT_ACCESS_MINUTES:60}
app.jwt.refresh-days=${JWT_REFRESH_DAYS:7}

# ---- First super admin (sirf tab banta hai jab koi super admin na ho) ----
app.platform.admin-email=${PLATFORM_ADMIN_EMAIL:admin@platform.local}
app.platform.admin-password=${PLATFORM_ADMIN_PASSWORD:Admin@123}

# ---- Uploads ----
app.upload-dir=${UPLOAD_DIR:./uploads}

# Dev me vite proxy use hota hai; direct call ke liye CORS
app.cors.allowed-origin-patterns=${CORS_ORIGINS:http://localhost:5173,http://*.localhost:5173,https://*.yourdomain.com,https://yourdomain.com}
