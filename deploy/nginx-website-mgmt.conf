# sudo cp deploy/nginx-website-mgmt.conf /etc/nginx/sites-available/website-mgmt
# sudo ln -s /etc/nginx/sites-available/website-mgmt /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
#
# Billing (bizio.conf) *.biziotechnologies.com par apne clients chalata hai, isliye yahan SIRF exact naam.
# nginx me exact naam wildcard se pehle match hota hai.
# Nayi website = dono server_name me naam jodo, phir: sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name website.biziotechnologies.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name website.biziotechnologies.com;

    # billing wala wildcard certificate (*.biziotechnologies.com)
    ssl_certificate /etc/letsencrypt/live/biziotechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biziotechnologies.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 30M;
    root /var/www/website-mgmt/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:6900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /files/ {
        proxy_pass http://127.0.0.1:6900;
        proxy_set_header Host $host;
    }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:6900/api/public/sitemap.xml; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /robots.txt  { proxy_pass http://127.0.0.1:6900/api/public/robots.txt;  proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
